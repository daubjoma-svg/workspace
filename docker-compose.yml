services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_BIND_IP:-0.0.0.0}:${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/sop-system.http.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/nginx-health | grep -q '^ok$'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - application
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sop_system}
      MYSQL_USER: ${DB_USER:-sop_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - database
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  app:
    image: ${APP_IMAGE:-sop-system:latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # 默认只监听宿主机回环地址，由 Nginx/Caddy 提供公网 HTTPS；内网直连可改成 0.0.0.0。
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sop_system}
      DB_USER: ${DB_USER:-sop_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_TIMEZONE: ${DB_TIMEZONE:-+00:00}
      SOP_MASTER_KEY: ${SOP_MASTER_KEY:?Set SOP_MASTER_KEY in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JIRA_DEFAULT_PROJECT_KEY: ${JIRA_DEFAULT_PROJECT_KEY:-}
      MAX_ARCHIVE_MB: ${MAX_ARCHIVE_MB:-200}
      TAR_TIMEOUT_MS: ${TAR_TIMEOUT_MS:-120000}
      GITLAB_TIMEOUT_MS: ${GITLAB_TIMEOUT_MS:-30000}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-60000}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - app-data:/app/server/data
      - app-uploads:/app/server/uploads
      # CLI 的登录状态、配置和会话随容器重建保留，不挂载宿主机 root 的 HOME。
      - app-trae:/home/node/.trae
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((res)=>{if(!res.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - application
      - database
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mysql-data:
  app-data:
  app-uploads:
  app-trae:

networks:
  application:
  database:
    internal: true
